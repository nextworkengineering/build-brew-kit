<!doctype html><html lang="en"><head><meta charset="utf-8">
<!--
  ARCHETYPE D · Block + photo  (the poster)
  Use for: a punchy claim. Clean photo up top, solid paper block below carries a bold grotesk line.
  Slots: {{PHOTO}} {{KICKER}} {{H1}} {{H2}} {{BODY}} {{CTA}}
  1080x1350. Grotesk-forward. FK Grotesk Neue (headline uses the Black weight).
-->
<style>
  :root{ --paper:#f8f5f0; --ink:#26221e; --muted:#8a8175; --body:#6b655c;
    --ground:var(--paper); --fg:var(--ink); --fg-muted:var(--body); }
  *{margin:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px}
  .frame{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--ground);
    display:flex;flex-direction:column;font-family:"FK Grotesk Neue",system-ui,-apple-system,sans-serif}
  .photo{width:1080px;height:812px;object-fit:cover;object-position:50% 42%;
    filter:brightness(.96) contrast(1.05) saturate(.93)}
  .block{flex:1;padding:64px 72px 60px;display:flex;flex-direction:column;justify-content:space-between}
  .kicker{font-weight:500;font-size:20px;color:var(--fg-muted)}
  .head{margin-top:20px}
  .head div{font-weight:900;font-size:66px;line-height:64px;letter-spacing:-.02em;color:var(--fg)}
  .body{margin-top:20px;font-weight:400;font-size:24px;line-height:33px;color:var(--fg-muted);max-width:820px}
  .row{display:flex;align-items:center;justify-content:space-between}
  .pill{display:flex;align-items:center;gap:10px;background:var(--fg);padding:15px 28px;border-radius:999px}
  .pill span{font-weight:500;font-size:20px;color:var(--ground)}
  .mark{width:46px;height:46px;flex-shrink:0}
  .mark svg path{fill:var(--fg)}
</style></head>
<body><div class="frame">
  <img class="photo" src="{{PHOTO}}">
  <div class="block">
    <div>
      <div class="kicker">{{KICKER}}</div>
      <div class="head"><div>{{H1}}</div><div>{{H2}}</div></div>
      <div class="body">{{BODY}}</div>
    </div>
    <div class="row">
      <div class="pill"><span>{{CTA}}</span><span>&rarr;</span></div>
